<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - TinyTalk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>My Profile</h1>
        <a href="index.html">Back to Feed</a>
        <button id="logoutBtn">Logout</button>
    </header>

    <main>
        <section id="profileInfo">
            <h2 id="usernameDisplay">Username</h2>
            <input type="text" id="newUsername" placeholder="Change username">
            <button id="updateUsernameBtn">Update</button>
        </section>

        <section id="myTweets">
            <h2>My Tweets</h2>
            <!-- User tweets appear here -->
        </section>
    </main>
    
    <script type="module" src="js/profile.js"></script>
</body>
</html>
